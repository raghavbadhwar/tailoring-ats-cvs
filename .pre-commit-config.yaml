repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint
        entry: ruff check
        language: system
        types: [python]
      - id: mypy
        name: Mypy core package
        entry: mypy src/ats_agent
        language: system
        pass_filenames: false
      - id: unit-tests
        name: Unit and integration tests
        entry: python -m unittest discover -s tests -v
        language: system
        pass_filenames: false
      - id: benchmark-gates
        name: Safety benchmark gates
        entry: python scripts/check_benchmark.py
        language: system
        pass_filenames: false
