name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,documents]"
      - name: Check release tree integrity
        run: python scripts/check_release_tree.py
      - name: Validate skill and benchmark fixtures
        run: python scripts/validate_skill.py
      - name: Check repository whitespace
        run: git diff --check
      - name: Lint
        run: ruff check src tests scripts
      - name: Type check
        run: mypy src/ats_agent
      - name: Test with coverage
        run: |
          coverage run --source=ats_agent -m unittest discover -s tests -v
          coverage report --show-missing --fail-under=80
      - name: Run safety benchmark gates
        run: python scripts/check_benchmark.py
      - name: Audit Python dependencies
        run: pip-audit --local
      - name: Compile Python sources
        run: python -m compileall -q src scripts tests
      - name: Build distributions
        run: python -m build
      - name: Test installed wheel outside repository
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd /tmp
          ats-agent --help
          ats-agent benchmark > benchmark.json
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("benchmark.json").read_text())
          assert result["case_count"] >= 3
          PY
      - name: Run approval-gated example end to end
        run: |
          run_dir="$(mktemp -d)"
          ats-agent propose \
            examples/sample_resume.txt \
            examples/sample_job.md \
            --evidence examples/sample_project_bank.md \
            --candidate-id sample-candidate \
            --output "$run_dir/proposal.json"
          ats-agent review "$run_dir/proposal.json" \
            --markdown "$run_dir/review.md" \
            --html "$run_dir/review.html" \
            --output-document tailored-resume.txt
          test -s "$run_dir/review.md"
          test -s "$run_dir/review.html"
          grep -q "Requirement-to-Evidence Matrix" "$run_dir/review.md"
          grep -q "Download approval manifest" "$run_dir/review.html"
          python - "$run_dir/proposal.json" "$run_dir/approved_changes.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          proposal_path = Path(sys.argv[1])
          manifest_path = Path(sys.argv[2])
          proposal = json.loads(proposal_path.read_text(encoding="utf-8"))
          change = next(
              item for item in proposal["changes"] if item.get("supported")
          )
          variant_id = (
              change.get("default_variant") or change["variants"][0]["id"]
          )
          manifest = {
              "schema_version": 2,
              "proposal": proposal_path.name,
              "proposal_digest": proposal["proposal_digest"],
              "selections": [
                  {"change_id": change["id"], "variant_id": variant_id}
              ],
              "approved_change_ids": [change["id"]],
              "document_mode": "preserve",
              "output": "tailored-resume.txt",
          }
          manifest_path.write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          (
            cd "$run_dir"
            ats-agent apply approved_changes.json > apply-result.json
            test -f tailored-resume.txt
            test -f tailored-resume.txt.applied.json
            grep -qi "workflow automation" tailored-resume.txt
          )
          grep -q "Helped build automated order workflows" examples/sample_resume.txt

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Smoke installed CLI
        run: |
          cd /tmp
          ats-agent --help
          ats-agent benchmark
