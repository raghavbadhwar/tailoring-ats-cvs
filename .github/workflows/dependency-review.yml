name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install declared project dependencies and auditor
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[documents]" pip-audit
      - name: Reject known vulnerable resolved dependencies
        run: pip-audit --local
      - name: Verify project metadata remains parseable
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          assert project["dependencies"]
          assert project["requires-python"] == ">=3.10"
          PY
