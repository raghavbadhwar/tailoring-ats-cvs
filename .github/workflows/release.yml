name: Release

on:
  push:
    tags:
      - "v1.0.0-beta.*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify tag matches package beta
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "v1.0.0-beta.3"
          python - <<'PY'
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert version == "1.0.0b3", version
          PY
      - name: Install release toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,documents]"
      - name: Detect protected holdout availability
        id: holdout
        env:
          PRIVATE_HOLDOUT_B64: ${{ secrets.PRIVATE_HOLDOUT_B64 }}
        run: |
          # Beta tags publish without the holdout when it is absent, but the gate stays
          # mandatory the moment the secret exists. Stable v1.0.0 releases must always
          # pass `release_check.py --require-holdout --private-holdout ...`.
          if [ -n "$PRIVATE_HOLDOUT_B64" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Materialize protected private holdout
        if: steps.holdout.outputs.available == 'true'
        env:
          PRIVATE_HOLDOUT_B64: ${{ secrets.PRIVATE_HOLDOUT_B64 }}
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path
          encoded = os.environ.get("PRIVATE_HOLDOUT_B64", "")
          payload = base64.b64decode(encoded, validate=True)
          path = Path("/tmp/private-holdout.jsonl")
          path.write_bytes(payload)
          if not path.stat().st_size:
              raise SystemExit("private holdout is empty")
          PY
      - name: Run release gates (with protected holdout)
        if: steps.holdout.outputs.available == 'true'
        run: python scripts/release_check.py --private-holdout /tmp/private-holdout.jsonl > release-check.json
      - name: Run release gates (holdout deferred for beta)
        if: steps.holdout.outputs.available != 'true'
        run: python scripts/release_check.py > release-check.json
      - name: Run security gates
        run: |
          pip-audit --local
          bandit -r src/ats_agent -q -ll
      - name: Build wheel and source distribution
        run: |
          python -m build
          # tailor-cv-agent-skill-v1.0.0-beta.3.zip and tailoring-ats-cvs-claude-plugin-v1.0.0-beta.3.zip
          python scripts/build_agent_bundles.py --output dist/agent-adapters
          python scripts/verify_agent_bundle.py dist/agent-adapters
      - name: Clean-install wheel outside repository
        run: |
          python -m venv /tmp/ats-release
          /tmp/ats-release/bin/python -m pip install --upgrade pip
          /tmp/ats-release/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/ats-release/bin/ats-agent doctor > doctor.json
          /tmp/ats-release/bin/ats-agent benchmark --suite smoke --report smoke.json > /dev/null
      - name: Generate SBOM and checksums
        shell: bash
        run: |
          cyclonedx-py environment --output-format JSON --output-file sbom.cdx.json
          sha256sum dist/*.whl dist/*.tar.gz dist/agent-adapters/* sbom.cdx.json release-check.json benchmarks/v3/reports/*.json > SHA256SUMS
      - name: Upload immutable release evidence
        uses: actions/upload-artifact@v6
        with:
          name: v1-beta-release-evidence
          path: |
            dist/*
            dist/agent-adapters/*
            sbom.cdx.json
            SHA256SUMS
            release-check.json
            benchmarks/v3/reports/*.json
          if-no-files-found: error
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ "$(python -c "import json; print(json.load(open('release-check.json'))['protected_holdout']['executed'])")" = "True" ]; then
            HOLDOUT_NOTE="Protected 60-case private holdout: executed and passed."
          else
            HOLDOUT_NOTE="**PROTECTED HOLDOUT NOT EXECUTED.** Public Benchmark v3, full CI, and security gates passed; the private holdout gate is deferred for this beta and remains mandatory for stable v1.0.0."
          fi
          gh release delete "$GITHUB_REF_NAME" --yes 2>/dev/null || true
          gh release create "$GITHUB_REF_NAME" \
            dist/*.whl dist/*.tar.gz dist/agent-adapters/* sbom.cdx.json SHA256SUMS release-check.json benchmarks/v3/reports/*.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "Trustworthy CV Tailoring v1.0.0-beta.3" \
            --notes "Approval-first beta. Includes reproducible package artifacts, SBOM, checksums, public benchmark reports, and release-gate verification metadata. No universal ATS or employer-acceptance claims are made.

          $HOLDOUT_NOTE" \
            --prerelease \
            --verify-tag
  publish-pypi:
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build --outdir dist/python
      - name: Publish Python distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/python/
