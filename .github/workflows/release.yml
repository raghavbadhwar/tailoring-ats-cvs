name: Release

on:
  push:
    tags:
      - "v1.0.0-beta.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify tag matches package beta
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "v1.0.0-beta.1"
          python - <<'PY'
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert version == "1.0.0b1", version
          PY
      - name: Install release toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,documents]"
      - name: Materialize protected private holdout
        env:
          PRIVATE_HOLDOUT_B64: ${{ secrets.PRIVATE_HOLDOUT_B64 }}
        shell: bash
        run: |
          test -n "$PRIVATE_HOLDOUT_B64"
          printf '%s' "$PRIVATE_HOLDOUT_B64" | base64 --decode > /tmp/private-holdout.jsonl
          test -s /tmp/private-holdout.jsonl
      - name: Run release gates and protected holdout
        run: python scripts/release_check.py --private-holdout /tmp/private-holdout.jsonl > release-check.json
      - name: Run security gates
        run: |
          pip-audit --local
          bandit -r src/ats_agent -q
      - name: Build wheel and source distribution
        run: python -m build
      - name: Clean-install wheel outside repository
        run: |
          python -m venv /tmp/ats-release
          /tmp/ats-release/bin/python -m pip install --upgrade pip
          /tmp/ats-release/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/ats-release/bin/ats-agent doctor > doctor.json
          /tmp/ats-release/bin/ats-agent benchmark --suite smoke --report smoke.json > /dev/null
      - name: Generate SBOM and checksums
        shell: bash
        run: |
          cyclonedx-py environment --output-format JSON --output-file sbom.cdx.json
          sha256sum dist/* sbom.cdx.json release-check.json benchmarks/v3/reports/*.json > SHA256SUMS
      - name: Upload immutable release evidence
        uses: actions/upload-artifact@v6
        with:
          name: v1-beta-release-evidence
          path: |
            dist/*
            sbom.cdx.json
            SHA256SUMS
            release-check.json
            benchmarks/v3/reports/*.json
          if-no-files-found: error
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/* sbom.cdx.json SHA256SUMS release-check.json benchmarks/v3/reports/*.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "Trustworthy CV Tailoring v1.0.0-beta.1" \
            --notes "Approval-first beta. Includes reproducible package artifacts, SBOM, checksums, public benchmark reports, and protected holdout verification metadata. No universal ATS or employer-acceptance claims are made." \
            --prerelease \
            --verify-tag
