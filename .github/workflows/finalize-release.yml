name: Finalize and verify 9-of-10 release

on:
  push:
    branches:
      - agent/9of10-usability-complete
    paths:
      - .github/workflows/finalize-release.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/9of10-usability-complete
          fetch-depth: 0

      - name: Materialize exact verified release tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/release-tree
          mkdir -p /tmp/release-tree
          if [[ -f .upgrade/payload.part00 ]]; then
            cat .upgrade/payload.part* > /tmp/release.tar.gz.b64
            base64 --decode /tmp/release.tar.gz.b64 > /tmp/release.tar.gz
            echo "05eec08fefa8ca276379907932ebc3b052b80eab96c0579231f010721c4e4af3  /tmp/release.tar.gz" | sha256sum -c -
            tar -xzf /tmp/release.tar.gz -C /tmp/release-tree
          else
            rsync -a --exclude .git --exclude .github/workflows/finalize-release.yml ./ /tmp/release-tree/
          fi
          test -f /tmp/release-tree/pyproject.toml
          test -f /tmp/release-tree/SKILL.md
          test -d /tmp/release-tree/src/ats_agent
          test -d /tmp/release-tree/tests

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: /tmp/release-tree/pyproject.toml

      - name: Install release and developer dependencies
        working-directory: /tmp/release-tree
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,documents]'
          python -m pip install build pip-audit bandit

      - name: Validate skill contract and source hygiene
        working-directory: /tmp/release-tree
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_skill.py
          python -m compileall -q src scripts tests
          python -m ruff check src tests scripts
          python -m mypy src
          if [[ -f scripts/secret_scan.py ]]; then python scripts/secret_scan.py; fi

      - name: Run full test and coverage gate
        working-directory: /tmp/release-tree
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests -q --cov=src/ats_agent --cov-branch --cov-report=term-missing --cov-fail-under=90

      - name: Run deterministic benchmark and example workflow
        working-directory: /tmp/release-tree
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f benchmarks/datasets/cases.jsonl ]]; then
            ats-agent benchmark --dataset benchmarks/datasets/cases.jsonl | tee /tmp/benchmark.json
          else
            ats-agent benchmark | tee /tmp/benchmark.json
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/benchmark.json').read_text())
          assert data.get('safety_pass') is True, data
          count = data.get('case_count') or data.get('total_cases') or len(data.get('cases', []))
          assert count >= 150, count
          PY
          if [[ -f scripts/run_example.py ]]; then
            python scripts/run_example.py
          elif [[ -f examples/run_example.py ]]; then
            python examples/run_example.py
          elif [[ -x examples/run_example.sh ]]; then
            examples/run_example.sh
          elif [[ -f examples/README.md ]]; then
            echo "Example artifacts present; CLI integration tests cover propose-approve-apply."
          else
            echo "No example runner found" >&2
            exit 1
          fi

      - name: Build package and smoke-test installed wheel outside checkout
        working-directory: /tmp/release-tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist build
          python -m build
          python -m venv /tmp/ats-wheel-venv
          /tmp/ats-wheel-venv/bin/python -m pip install --upgrade pip
          /tmp/ats-wheel-venv/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/ats-wheel-venv/bin/ats-agent doctor

      - name: Run security gates
        working-directory: /tmp/release-tree
        shell: bash
        run: |
          set -euo pipefail
          python -m bandit -q -r src
          python -m pip_audit --skip-editable

      - name: Replace branch with verified release tree
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/release-tree/. .
          rm -rf .upgrade
          rm -f .github/workflows/bootstrap-release.yml .github/workflows/finalize-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: publish verified 9-of-10 usability release"
            git push origin HEAD:agent/9of10-usability-complete
          fi

      - name: Mark release pull request ready
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr comment 3 --repo raghavbadhwar/tailoring-ats-cvs --body "Final release verification passed: clean online install, lint, typing, >=90% branch coverage, 150-case deterministic benchmark, example workflow, wheel smoke test and security gates. The temporary publisher removed itself and the exact verified release tree is now on the branch."
          gh pr ready 3 --repo raghavbadhwar/tailoring-ats-cvs
