name: Apply verified 9-of-10 upgrade

on:
  push:
    branches:
      - agent/9of10-core
    paths:
      - .upgrade/**
      - .github/workflows/apply-upgrade.yml

permissions:
  contents: write

concurrency:
  group: apply-9of10-upgrade
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/9of10-core
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify and apply payload
        run: python .upgrade/apply.py

      - name: Install runtime with document adapter
        run: python -m pip install -e '.[documents]'

      - name: Validate portable skill and benchmark fixtures
        run: python scripts/validate_skill.py

      - name: Run unit, safety, document, and CLI tests
        run: python -m unittest discover -s tests -v

      - name: Run safety benchmark gates
        run: python scripts/check_benchmark.py

      - name: Compile all Python sources
        run: python -m compileall -q src scripts tests

      - name: Commit verified implementation to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: complete evidence-grounded 9/10 usability upgrade"
          git push origin HEAD:agent/9of10-core
