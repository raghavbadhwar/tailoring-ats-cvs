[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tailoring-ats-cvs"
version = "1.0.0b1"
description = "Approval-first, evidence-grounded career intelligence and CV tailoring"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Raghav Badhwar"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "defusedxml>=0.7,<1",
  "pydantic>=2.8,<3",
  "python-docx>=1.1",
]

[project.optional-dependencies]
documents = ["pypdf>=4.0"]
dev = [
  "bandit>=1.8",
  "build>=1.2",
  "coverage>=7.6",
  "cyclonedx-bom>=6.0",
  "mypy>=1.10",
  "pip-audit>=2.7",
  "ruff>=0.6",
]

[project.scripts]
ats-agent = "ats_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ats_agent = ["data/*.jsonl", "data/benchmark-v3/*.jsonl"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F", "B"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["ats_agent"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
