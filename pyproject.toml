[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tailoring-ats-cvs"
version = "0.1.0"
description = "Approval-first, evidence-backed ATS CV tailoring skill"
requires-python = ">=3.9"

[project.scripts]
ats-agent = "ats_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
